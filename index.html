<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Extinção dos Dinossauros</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }

    #cenario {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 70%, #3b7a57 70%, #2d5a27 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 15vh;
    }

    /* Camada preta */
    #escuridao {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease;
      z-index: 10;
    }

    .dino-box {
      position: relative;
      width: 260px;
      height: 260px;
      z-index: 20;
    }

    .dino-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 1.5s ease;
    }

    #dino-fossil {
      opacity: 0;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
    }

    /* Meteoros */
    .meteoro {
      position: fixed;
      top: -80px;
      width: 35px;
      height: 35px;
      background: radial-gradient(circle, #ffffff, #ffae00, #ff2a00);
      border-radius: 50%;
      box-shadow: 0 0 30px #ff4500, 0 0 60px #ff0000;
      z-index: 5;
      animation: cair 1.1s linear forwards;
    }

    .meteoro::after {
      content: '';
      position: absolute;
      top: -70px;
      left: 18px;
      width: 10px;
      height: 100px;
      background: linear-gradient(to top, rgba(255, 100, 0, 0.9), transparent);
      transform: rotate(25deg);
      transform-origin: bottom center;
    }

    @keyframes cair {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(-300px, 120vh);
      }
    }

    /* Tremor */
    @keyframes tremer {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 6px); }
      50% { transform: translate(8px, -6px); }
      75% { transform: translate(-6px, -6px); }
    }

    .tremendo {
      animation: tremer 0.3s infinite;
    }

    /* Botão de Ação */
    #btn-acao {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #d9381e;
      border: 2px solid #fff;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #btn-acao:hover {
      background-color: #b02a14;
    }
  </style>
</head>
<body>

  <!-- Botão garantido caso o início automático seja bloqueado -->
  <button id="btn-acao" onclick="iniciarAnimacao()">☄️ Lançar Meteoros</button>

  <div id="cenario">
    <div id="escuridao"></div>

    <div class="dino-box">
      <!-- DINOSSAURO VIVO -->
      <svg id="dino-vivo" class="dino-svg" viewBox="0 0 200 200">
        <path d="M 55 130 Q 15 125 10 95 Q 25 115 60 110 Z" fill="#2e8b57"/>
        <rect x="65" y="135" width="16" height="35" rx="6" fill="#236b43"/>
        <path d="M 62 168 L 85 168 L 85 174 L 62 174 Z" fill="#1b5233"/>
        <ellipse cx="90" cy="115" rx="38" ry="30" fill="#3cb371"/>
        <path d="M 75 138 Q 105 142 122 120 Q 105 132 75 130 Z" fill="#98fb98"/>
        <rect x="102" y="135" width="16" height="35" rx="6" fill="#2e8b57"/>
        <path d="M 100 168 L 122 168 L 122 174 L 100 174 Z" fill="#236b43"/>
        <path d="M 122 105 L 140 110 L 136 116 L 120 112 Z" fill="#2e8b57"/>
        <path d="M 105 95 L 115 50 L 145 50 L 135 100 Z" fill="#3cb371"/>
        <rect x="112" y="35" width="58" height="32" rx="12" fill="#3cb371"/>
        <path d="M 135 56 L 168 56" stroke="#1b5233" stroke-width="3" stroke-linecap="round"/>
        <circle cx="145" cy="45" r="4.5" fill="#ffffff"/>
        <circle cx="146" cy="45" r="2" fill="#000000"/>
        <polygon points="75,86 82,74 89,86" fill="#ff8c00"/>
        <polygon points="92,86 99,74 106,86" fill="#ff8c00"/>
        <polygon points="107,75 115,63 118,78" fill="#ff8c00"/>
      </svg>

      <!-- DINOSSAURO FÓSSIL -->
      <svg id="dino-fossil" class="dino-svg" viewBox="0 0 200 200">
        <circle cx="20" cy="102" r="3" fill="#e8e4d9"/>
        <circle cx="30" cy="108" r="4" fill="#e8e4d9"/>
        <circle cx="42" cy="113" r="5" fill="#e8e4d9"/>
        <circle cx="55" cy="116" r="6" fill="#e8e4d9"/>
        <path d="M 55 116 Q 90 105 122 92 L 126 55" stroke="#e8e4d9" stroke-width="7" stroke-dasharray="8 4" fill="none"/>
        <path d="M 75 112 Q 72 132 82 136" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 88 109 Q 85 134 95 138" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 101 105 Q 98 130 108 134" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 113 100 Q 112 122 120 125" stroke="#dcd6c8" stroke-width="4" stroke-linecap="round" fill="none"/>
        <line x1="72" y1="125" x2="72" y2="148" stroke="#e8e4d9" stroke-width="6" stroke-linecap="round"/>
        <line x1="72" y1="152" x2="72" y2="170" stroke="#e8e4d9" stroke-width="5" stroke-linecap="round"/>
        <path d="M 65 172 L 82 172" stroke="#e8e4d9" stroke-width="4" stroke-linecap="round"/>
        <line x1="110" y1="125" x2="110" y2="148" stroke="#e8e4d9" stroke-width="6" stroke-linecap="round"/>
        <line x1="110" y1="152" x2="110" y2="170" stroke="#e8e4d9" stroke-width="5" stroke-linecap="round"/>
        <path d="M 103 172 L 120 172" stroke="#e8e4d9" stroke-width="4" stroke-linecap="round"/>
        <path d="M 124 98 L 138 105 L 134 112" stroke="#dcd6c8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M 115 36 L 166 38 L 164 52 L 136 52 L 136 63 L 162 63 L 160 68 L 116 66 Z" fill="#e8e4d9"/>
        <circle cx="134" cy="45" r="6.5" fill="#000000"/>
        <circle cx="156" cy="44" r="3" fill="#000000"/>
        <polygon points="140,52 143,58 146,52" fill="#e8e4d9"/>
        <polygon points="149,52 152,58 155,52" fill="#e8e4d9"/>
        <polygon points="158,52 161,58 164,52" fill="#e8e4d9"/>
      </svg>
    </div>
  </div>

  <script>
    var timerMeteoros;
    var timerFim;

    function iniciarAnimacao() {
      var cenario = document.getElementById('cenario');
      var escuridao = document.getElementById('escuridao');
      var dinoVivo = document.getElementById('dino-vivo');
      var dinoFossil = document.getElementById('dino-fossil');
      var btn = document.getElementById('btn-acao');

      // Limpa qualquer animação anterior
      clearInterval(timerMeteoros);
      clearTimeout(timerFim);

      // Reinicia o visual para o dia
      escuridao.style.opacity = '0';
      dinoVivo.style.opacity = '1';
      dinoFossil.style.opacity = '0';
      btn.style.display = 'none';
      cenario.classList.add('tremendo');

      // Cria chuva de meteoros imediatamente
      timerMeteoros = setInterval(function() {
        var m = document.createElement('div');
        m.className = 'meteoro';
        m.style.left = (Math.random() * 100 + 10) + '%';
        document.body.appendChild(m);

        setTimeout(function() {
          if (m.parentNode) m.parentNode.removeChild(m);
        }, 1200);
      }, 150);

      // Após 2.5 segundos, escurece tudo e vira fóssil
      timerFim = setTimeout(function() {
        clearInterval(timerMeteoros);
        escuridao.style.opacity = '1';
        dinoVivo.style.opacity = '0';
        dinoFossil.style.opacity = '1';

        setTimeout(function() {
          cenario.classList.remove('tremendo');
          btn.innerText = '🔄 Repetir';
          btn.style.display = 'block';
        }, 1500);
      }, 2500);
    }

    // Inicia automaticamente após 800 milissegundos
    setTimeout(iniciarAnimacao, 800);
  </script>

</body>
</html>
